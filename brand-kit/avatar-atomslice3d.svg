<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgGrad" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#FFF07C"/>
      <stop offset="55%" stop-color="#FFE047"/>
      <stop offset="100%" stop-color="#F5B800"/>
    </radialGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#3B2900" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Bold high-visibility studio yellow-gold backdrop (pops cleanly in dark Reels/TikTok/Shorts UI!) -->
  <rect width="1024" height="1024" fill="url(#bgGrad)"/>

  <!-- Subtle crisp architectural grid dots (clean studio vibe, invisible at 32px so zero clutter) -->
  <g fill="#0E1216" opacity="0.06">
    <circle cx="140" cy="140" r="8"/><circle cx="884" cy="140" r="8"/>
    <circle cx="140" cy="884" r="8"/><circle cx="884" cy="884" r="8"/>
  </g>

  <!-- MAIN ICON: Oversized Isometric Sliced Cube (fills ~82% of circular safe zone — razor-sharp even at 28px Reels!) -->
  <g filter="url(#drop)" transform="translate(502, 540) scale(1.18)">

    <!-- SLAB 1 (Bottom-Back Main Chunk) -->
    <g transform="translate(-14, 92)">
      <!-- Left face -->
      <polygon points="-245,-70 0,70 0,210 -245,70" fill="#182026" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
      <!-- Right face -->
      <polygon points="0,70 245,-70 245,70 0,210" fill="#0B0F13" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
      <!-- Inner freshly sliced top cross-section (vibrant coral-orange interior!) -->
      <polygon points="0,-210 245,-70 0,70 -245,-70" fill="#FF5733" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
    </g>

    <!-- SLAB 2 (Middle Clean Slice — clearly offset left-up to reveal vibrant coral below!) -->
    <g transform="translate(-44, -36)">
      <!-- Left face -->
      <polygon points="-245,-54 0,86 0,162 -245,22" fill="#232E36" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
      <!-- Right face -->
      <polygon points="0,86 245,-54 245,22 0,162" fill="#10161B" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
      <!-- Inner freshly sliced top cross-section (electric cyan interior!) -->
      <polygon points="0,-194 245,-54 0,86 -245,-54" fill="#14D8C6" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
    </g>

    <!-- SLAB 3 (Top Sliding Slice — cleanly gliding off up-right like a butter cut!) -->
    <g transform="translate(46, -182)">
      <!-- Left face -->
      <polygon points="-245,-42 0,98 0,168 -245,28" fill="#2C3A45" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
      <!-- Right face -->
      <polygon points="0,98 245,-42 245,28 0,168" fill="#151C22" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
      <!-- Crisp pure white top face -->
      <polygon points="0,-182 245,-42 0,98 -245,-42" fill="#FFFFFF" stroke="#0B0E11" stroke-width="15" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
