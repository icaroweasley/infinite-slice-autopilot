name: Infinite Slice 24/7 Reels Autopilot

on:
  # Primary trigger: every 6 hours (:08) via Google Apps Script calling workflow_dispatch
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run only (render MP4 + preview caption, do NOT post to Instagram)'
        type: boolean
        default: false
      quick:
        description: 'Quick test render (540x960 @ 30fps, 3 rounds)'
        type: boolean
        default: false
  # Smart backup trigger: 37 minutes after each 6-hour slot (04:45, 10:45, 16:45, 22:45 UTC).
  # Automatically skips in 3 seconds if data/history.json already has a post within the last 4.5h,
  # preventing BOTH missed posts (if Apps Script fails) AND duplicate posts!
  schedule:
    - cron: '45 4,10,16,22 * * *'

permissions:
  contents: write

concurrency:
  group: infinite-slice-autopilot
  cancel-in-progress: false

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Smart guard (secrets + 4.5h anti-duplicate check for backup schedule)
        id: guard
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] && [ -z "$N8N_WEBHOOK_URL" ] && [ -z "$IG_ACCESS_TOKEN" ]; then
            echo "No Instagram publishing secrets configured yet — skipping scheduled run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            git fetch origin main && git reset --hard origin/main
            SHOULD_SKIP=$(node -e '
              const fs = require("fs");
              try {
                const h = JSON.parse(fs.readFileSync("data/history.json", "utf8"));
                const times = (h.entries || [])
                  .filter((e) => !String(e.format || "").startsWith("youtube-longform"))
                  .filter((e) => e.status === "published" || e.publishedAt || e.publish?.mediaId)
                  .map((e) => Date.parse(e.publishedAt || e.createdAt))
                  .filter((t) => Number.isFinite(t));
                if (!times.length) { console.log("false"); process.exit(0); }
                const latest = Math.max(...times);
                const ageHours = (Date.now() - latest) / 3600000;
                console.error(`[guard] Latest published post was ${ageHours.toFixed(2)}h ago (threshold: 4.50h).`);
                console.log(ageHours < 4.5 ? "true" : "false");
              } catch (err) {
                console.error("[guard] Could not read history.json:", err.message);
                console.log("false");
              }
            ')
            if [ "$SHOULD_SKIP" = "true" ]; then
              echo "Backup schedule skipped cleanly — a post was already published within the last 4.5 hours!"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Backup schedule activating — no post published in the last 4.5 hours!"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system FFmpeg & Chromium dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install npm dependencies & Playwright Chromium
        if: steps.guard.outputs.skip != 'true'
        run: |
          npm ci || npm install
          npx playwright-core install chromium --with-deps

      - name: Run Autonomous AI Creator + 60 FPS MP4 Render + Instagram Reels Publish
        if: steps.guard.outputs.skip != 'true'
        env:
          # Free Gemini API key (Google AI Studio) OR Anthropic Claude API key
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Publishing Method A (n8n / Make webhook) OR Method B (Meta Graph API direct upload: Instagram + Facebook Page Reels)
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          # Optional YouTube Shorts + TikTok Cross-Posting (Upload-Post pre-audited OR Direct YouTube Data API v3)
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          UPLOAD_POST_USER: ${{ secrets.UPLOAD_POST_USER }}
          UPLOAD_POST_PLATFORMS: ${{ secrets.UPLOAD_POST_PLATFORMS || 'youtube' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # Optional Official TikTok Content Posting API (Inbox Draft or Direct Post)
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ secrets.TIKTOK_MODE || 'inbox' }}
          TIKTOK_PRIVACY_LEVEL: ${{ secrets.TIKTOK_PRIVACY_LEVEL || 'PUBLIC_TO_EVERYONE' }}
        run: |
          FLAGS="--res 720x1280 --fps 60 --scale 0.72"
          if [ "${{ inputs.quick }}" = "true" ]; then
            FLAGS="--quick"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/autopilot-cloud.mjs $FLAGS --dry-run
          else
            node scripts/autopilot-cloud.mjs $FLAGS --publish --cleanup
          fi

      - name: Upload MP4 Artifact (Dry-Run Inspection)
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: rendered-reel-mp4
          path: output/*.mp4
          retention-days: 3

      - name: Commit updated anti-repetition history.json
        if: steps.guard.outputs.skip != 'true' && inputs.dry_run != true
        run: |
          git config user.name "Infinite Slice Bot"
          git config user.email "bot@infinite-slice.local"
          rm -rf engine/public/runtime-model
          git checkout -- engine/ 2>/dev/null || true
          node scripts/merge-history.mjs
